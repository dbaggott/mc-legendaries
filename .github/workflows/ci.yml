name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # One jar covers every MC line the mod claims. Each matrix row rebuilds the
    # same source against a different (MC, Fabric API) pair, so an accidental
    # use of a version-specific API fails here rather than in a player's log.
    #
    # The range is claimable because the vanilla surface this mod is built on is
    # present unchanged in all four lines: the same seven spear recipes, the same
    # data/minecraft/enchantment/lunge.json, the same mace recipe over heavy_core
    # and breeze_rod, the same dragon egg block loot table, the deepslate ores and
    # sculk_shrieker the pickaxe is crafted from, the dragon_breath, dragon_head,
    # echo_shard, nether_star and enchanted_book the sword and axe are crafted
    # from, the netherite sword, axe and pickaxe item definitions the resource
    # pack overrides, and the minecraft:tool component shape with an empty
    # #incorrect_for_netherite_tool. Widening the range means re-checking all of
    # that, not only the spears.
    #
    # A mixin target is a string, so a rename passes every row here and fails at
    # load instead. The targets are checked per line by hand rather than by this
    # matrix; nothing below starts the game.
    #
    # The 26.1 row is the *floor* row: oldest supported MC paired with the exact
    # `fabric-api` minimum declared in fabric.mod.json.
    #
    # The 26.3 row is forward-compat only and non-blocking: it builds against a
    # Mojang snapshot, so a breaking snapshot must not red-X unrelated PRs. Its
    # value is early warning the week a rename lands.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mc26.1-floor
            mc: '26.1'
            fabric_api: '0.143.12+26.1'
          - name: mc26.1.2
            mc: '26.1.2'
            fabric_api: '0.155.2+26.1.2'
          - name: mc26.2
            mc: '26.2'
            fabric_api: '0.156.0+26.2'
          - name: mc26.3-snapshot
            mc: '26.3-snapshot-6'
            fabric_api: '0.156.1+26.3'
            experimental: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - run: |
          ./gradlew build --stacktrace \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pfabric_api_version=${{ matrix.fabric_api }}

      # Upload the 26.2 (default-target) jar as the artifact used elsewhere.
      # The other rows are compat gates; their jars aren't published.
      - if: matrix.name == 'mc26.2'
        uses: actions/upload-artifact@v7
        with:
          name: legendaries-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # The single context branch protection requires. Which jobs gate a merge is then this
  # file's business rather than a Terraform change — `needs:` is the list.
  #
  # ⚠️ `if: always()` is load-bearing: without it this job is SKIPPED when a dependency
  # fails, and a skipped check reports SUCCESS to branch protection.
  ci-required:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs.*.result = $RESULTS"
          for r in ${RESULTS//,/ }; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency reported '$r'"; exit 1 ;;
            esac
          done
