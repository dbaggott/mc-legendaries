plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

version = project.mod_version
group = project.maven_group

// Named once: this is both where releases are published and where a client
// fetches the resource pack from at runtime.
def githubRepository = "dbaggott/mc-legendaries"
def resourcePackName = "legendaries-resourcepack"

repositories {
	// Loom adds Mojang + Fabric repos automatically. Add others here only
	// when depending on mods hosted elsewhere.
}

// No splitEnvironmentSourceSets(): this mod is common — items, recipes, loot
// and world state all run server-side, and it loads on a dedicated server with
// no client present. Add the split (and a `mods` block naming both source
// sets) if client-only rendering ever arrives.

loom {
	// Where the dev client and server keep their world, options and mods.
	//
	// Defaults to `run/` inside whichever directory Gradle was invoked from, which means a
	// worktree gets its own empty world and its own keybinds — fine for a throwaway test, useless
	// for playing the mod. Setting `legendaries_run_dir` to an absolute path in
	// ~/.gradle/gradle.properties points every worktree on that machine at one shared directory.
	//
	// A user-level property rather than a committed value on purpose: the path is per-machine, and
	// a clone that sets nothing still gets the ordinary `run/`.
	//
	// Two run configurations cannot share a directory at the same time — a client and a server both
	// launched against it will contend for the same world lock.
	runs.configureEach {
		String shared = providers.gradleProperty("legendaries_run_dir").getOrNull()
		// Blank counts as unset: a property line left empty in gradle.properties should fall back
		// to the default rather than resolve the run directory to nothing.
		if (shared != null && !shared.isBlank()) {
			runDir = shared
		}
	}
}

dependencies {
	// Versions live in gradle.properties so they're easy to bump in one place.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// What a client renders the Legendary Pickaxe from. Uploaded to the release by
// the github block below, and offered to joining players by ResourcePackOffer,
// which is where what it is for is written down.
def resourcePack = tasks.register("resourcePack", Zip) {
	from "src/main/resourcepack"
	archiveBaseName = resourcePackName
	archiveVersion = project.mod_version
	destinationDirectory = layout.buildDirectory.dir("libs")
	// The hash stamped into the jar has to match the file that ends up on the
	// release, so the same source must always zip to the same bytes.
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

processResources {
	def version = project.version
	inputs.property "version", version

	// Expands ${version} inside fabric.mod.json so we don't have to keep the
	// mod metadata's version field in sync with gradle.properties by hand.
	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// ResourcePackOffer has to name a URL and a hash for a file that does not
	// exist until the release is cut and that it cannot ask anything for at
	// runtime, so the build stamps both in. The URL is where the github block
	// below uploads the zip.
	def packFile = resourcePack.flatMap { it.archiveFile }
	def packUrl = "https://github.com/${githubRepository}/releases/download/" +
			"v${project.mod_version}/${resourcePackName}-${project.mod_version}.zip"
	inputs.file packFile
	inputs.property "packUrl", packUrl

	filesMatching("legendaries-resourcepack.properties") {
		expand "url": packUrl, "sha1": sha1(packFile.get().asFile)
	}
}

static String sha1(File file) {
	def digest = java.security.MessageDigest.getInstance("SHA-1")
	file.eachByte(64 * 1024) { byte[] buffer, int length -> digest.update(buffer, 0, length) }
	return digest.digest().encodeHex().toString()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Publishing targets (e.g. GitHub Packages, internal Maven) go here
		// when we have somewhere to publish to. CI uploads the jar as a
		// build artifact in the meantime.
	}
}

// Publishes the remapped mod jar to Modrinth and as a GitHub Release.
// Trigger with:
//   MODRINTH_API_KEY=… GITHUB_TOKEN=$(gh auth token) ./gradlew publishMods
// Or scope to one platform: publishModrinth / publishGithub.

// Per-version changelog file lives at .modrinth/changelogs/${mod_version}.md
// and the publish reads it lazily. See .modrinth/changelogs/README.md for
// the convention. A fail-fast guard below errors at publish time if the
// file doesn't exist for the current version.
def changelogPath = ".modrinth/changelogs/${project.mod_version}.md"
def changelogFile = layout.projectDirectory.file(changelogPath)

publishMods {
	// Use the standard `jar` task's output. In modern Loom the `jar` task produces
	// the remapped production jar directly (there is no separate `remapJar` task),
	// so the `file = remapJar.archiveFile` that most Fabric guides show would fail
	// to resolve here. `archiveFile` is a lazy provider, read at execution time.
	file = project.tasks.jar.archiveFile
	// Custom lazy Provider rather than providers.fileContents(...).asText so we
	// control the error path: a missing file would otherwise surface as
	// "platform.changelog doesn't have a configured value" from inside the
	// publish plugin, which doesn't point at the real problem.
	changelog = provider {
		if (!changelogFile.asFile.exists()) {
			throw new GradleException(
				"Changelog file ${changelogPath} not found. Create one before publishing v${project.mod_version}."
			)
		}
		changelogFile.asFile.text
	}
	// BETA while the version is 0.x. Every rule this mod adds is a refusal on a
	// player action, and the ones that matter most have been reasoned about far
	// more than they have been played. Switch to STABLE at 1.0.0, once that is
	// the other way round.
	type = BETA
	modLoaders.add("fabric")

	modrinth {
		projectId = providers.gradleProperty('modrinth_project_id').getOrElse('PLACEHOLDER_SET_ME')
		accessToken = providers.environmentVariable("MODRINTH_API_KEY")
		// Stable MC releases only — deliberately narrower than what the jar can
		// load on. fabric.mod.json admits the whole 26.3 line (snapshots
		// included), but every row here is a support claim regardless of release
		// channel, and a snapshot claim expires the week Mojang ships the next
		// one. Add "26.3" here when 26.3 leaves snapshot; the already-published
		// jar runs on it unchanged, so that is a metadata edit, not a release.
		//
		// 26.1.1 is claimed without a CI row of its own: it sits inside the
		// range the floor (26.1) and 26.1.2 rows bracket, and every class this
		// mod touches is byte-identical across both.
		minecraftVersions.add("26.1")
		minecraftVersions.add("26.1.1")
		minecraftVersions.add("26.1.2")
		minecraftVersions.add("26.2")
		// Required wherever the world runs — a dedicated server, or your own
		// game in single-player. Optional on a client joining somebody else's
		// server, where a vanilla client sees everything this mod does.
		environment = SERVER_ONLY_CLIENT_OPTIONAL
		requires {
			slug = "fabric-api"
		}
	}

	github {
		repository = githubRepository
		// The pack rides on the same release as the jar, at the URL the jar was
		// stamped with. Publishing one without the other leaves that URL dead.
		additionalFiles.from(resourcePack)
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		// Pin the release/tag to the actual commit being built. On a
		// workflow_dispatch from a branch, GITHUB_SHA is that branch's HEAD;
		// hardcoding "main" would cut the release against main instead.
		commitish = providers.environmentVariable("GITHUB_SHA").orElse("main")
		tagName = "v${project.mod_version}"
	}
}
